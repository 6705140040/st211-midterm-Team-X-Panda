name: tests

on:
  push:
  schedule:
    - cron: '0 0 * * *'  # Runs nightly at midnight UTC

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run Smoke Tests
        run: PYTHONPATH=. pytest -m smoke