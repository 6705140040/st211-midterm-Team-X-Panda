# Starter CI workflow for Part E. Complete it so that:
#   - every push runs the smoke tests
#   - a scheduled nightly run executes the FULL suite (including slow tests)
# It must actually run on GitHub Actions (checked via your Actions tab).

name: tests

on:
  push:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 01:00 the next day in Bangkok

jobs:
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -m smoke

  full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest