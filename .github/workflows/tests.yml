# Starter CI workflow for Part E. Complete it so that:
#   - every push runs the smoke tests
#   - a scheduled nightly run executes the FULL suite (including slow tests)
# It must actually run on GitHub Actions (checked via your Actions tab).

name: tests

on:
  push:
  schedule:
    - cron: '0 0 * * *'  # Runs nightly at midnight UTC

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run Smoke Tests on Push or Full Suite on Schedule
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Running full test suite for scheduled nightly run..."
            pytest
          else
            echo "Running smoke tests for push..."
            pytest -m smoke
          fi